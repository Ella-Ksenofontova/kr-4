<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="./css/media.css">
</head>

<body class="no-overflow">
    <header class="header">
        <div class="site-header">
            <a class="site-logo" href="index.html">MyShop</a>
            <button class="site-nav-opener" id="toggle-site-nav">
                <img src="./images/down-chevron.png" alt="Открыть навигацию" height="20" width="20">
            </button>
            <nav class="site-nav" aria-label="Основная навигация">
                <ul class="site-nav__list">
                    <li class="site-nav__list-item"><a href="./catalog.html" class="site-nav__link">Каталог</a></li>
                    <li class="site-nav__list-item"><a href="./contacts.html" class="site-nav__link">Обратная связь</a>
                    </li>
                    <li class="site-nav__list-item"><a href="./cart.html" class="site-nav__link">Корзина</a>
                    </li>
                </ul>
            </nav>
        </div>

    </header>

    <main class="main">
        <div class="catalog-wrapper">
            <div class="catalog-wrapper__customization-panel">
                <h1 class="heading catalog-wrapper__title">Каталог
                    <button class="button" id="open-filters"><img src="./images/filter.png"
                            alt="Открыть панель фильтров" width="15" height="15"></button>
                </h1>
                <div class="catalog-wrapper__input-group">
                    <label for="sort-by">Сортировать по: </label>
                    <select id="sort-by" class="catalog-wrapper__select">
                        <option value="price-asc">Возрастанию цены</option>
                        <option value="price-desc">Убыванию цены</option>
                        <option value="rating-asc">Возрастанию рейтинга</option>
                        <option value="rating-desc">Убыванию рейтинга</option>
                    </select>
                </div>
            </div>
            <form class="search-items-form" id="search-form">
                <div class="search-items-form__input-group">
                    <input type="text" id="search-items" placeholder="Поиск..." class="search-items-form__input">
                    <button class="search-items-form__button" type="submit" id="search-items-button"><img src="./images/search.png" alt="Найти"
                            width="15" height="15"></button>
                </div>
            </form>
            <aside class="filters-block">
                <form class="filters-panel">
                    <h2 class="heading filters-block__heading">Фильтры
                        <button class="filters-panel__button" id="close-filters" type="button"><img
                                src="./images/close-white.png" alt="Закрыть панель фильтров" height="15"
                                width="15"></button>
                    </h2>
                    <h3 class="heading filters-panel__title">Цена</h3>
                    <div class="filters-panel__price">
                        <label for="price-from">От: </label>
                        <input id="price-from" class="filters-panel__input">
                        <label for="price-to">До: </label>
                        <input id="price-to" class="filters-panel__input">
                    </div>
                    <div class="filters-panel__rating">
                        <input type="checkbox" id="good-rating" class="filters-panel__checkbox">
                        <label for="good-rating">Высокий рейтинг</label>
                        <span class="filters-panel__description">4 и более ⭐</span>
                    </div>
                    <h3 class="heading filters-panel__title">Категории</h3>
                    <button class="filters-panel__button" id="apply-filters">Применить</button>
                </form>
            </aside>
            <div class="filters-block-backdrop"></div>
            <div class="product-cards">

            </div>
        </div>
    </main>
    <footer id="contacts" class="footer">
        <p class="footer__paragraph">&copy; 2026 Элла Ксенофонтова. Все права защищены.</p>
        <p class="footer__paragraph"><a class="footer__link" href="tel:89858944403">+7 (985)-894-44-03</a></p>
    </footer>
    <script src="./js/index.js" type="module"></script>
    <script src="./js/catalog.js" type="module"></script>
</body>

</html>
